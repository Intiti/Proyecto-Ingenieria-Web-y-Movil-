version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: munisalud_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-munisalud_db}
    ports:
      - "5432:5432"
    volumes:
      - munisalud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - munisalud_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: munisalud_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-munisalud_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambiar_este_secreto}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "4000:4000"
    networks:
      - munisalud_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: munisalud_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - munisalud_net

volumes:
  munisalud_pgdata:

networks:
  munisalud_net:
    driver: bridge
